apiVersion: v1
kind: Service
metadata:
  name: imagedetection-api
  namespace: imagedetection
  labels:
    app: imagedetection-api
spec:
  type: ClusterIP
  selector:
    app: imagedetection-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
# Note: the "worker" sidecar container exposes no port and is intentionally
# not fronted by a Service — it's a queue consumer, not a request target.
