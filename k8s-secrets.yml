# Secret material for the imagedetection-api workload.
#
# The two resources below are ALTERNATIVES that both ultimately produce the
# same "imagedetection-secrets" Secret consumed by k8s-deploy.yml — apply
# whichever one matches the cluster's capabilities, never both at once.
#
# Primary path: Azure Key Vault Provider for Secrets Store CSI Driver.
# The AKS node pool's managed/workload identity is granted "get" on secrets
# in the Key Vault; the CSI driver mounts them as files in the pod AND (via
# secretObjects below) mirrors them into a native Kubernetes Secret so they
# can also be consumed as plain env vars. No secret value ever lives in this
# repo or in an ADO pipeline variable.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: imagedetection-akv
  namespace: imagedetection
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Workload Identity: the "imagedetection-api" ServiceAccount (see
    # k8s-deploy.yml) is federated to this Azure AD app registration, so pods
    # authenticate to Key Vault without a stored credential.
    clientID: "<AZURE_WORKLOAD_IDENTITY_CLIENT_ID>"
    tenantId: "<AZURE_TENANT_ID>"
    keyvaultName: "kv-imagedetection-prod"
    objects: |
      array:
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: datadog-api-key
          objectType: secret
        - |
          objectName: flower-basic-auth
          objectType: secret
  secretObjects:
    - secretName: imagedetection-secrets
      type: Opaque
      data:
        - objectName: redis-connection-string
          key: REDIS_URL
        - objectName: datadog-api-key
          key: DD_API_KEY
        - objectName: flower-basic-auth
          key: FLOWER_BASIC_AUTH
---
# Fallback for environments where the Key Vault CSI driver isn't installed
# (e.g. a Rancher-managed AKS cluster where that add-on hasn't been rolled
# out yet). In this path the ADO release pipeline's AzureKeyVault@2 task
# resolves secrets from the same Key Vault into pipeline variables, and a
# token-replacement step (Replace Tokens / envsubst) substitutes the
# "#{...}#" placeholders below before `kubectl apply -f` runs. The resulting
# manifest with real values is never written to disk outside the pipeline
# agent's ephemeral workspace, and pipeline variables backed by Key Vault are
# masked as secrets in the ADO logs.
apiVersion: v1
kind: Secret
metadata:
  name: imagedetection-secrets
  namespace: imagedetection
  annotations:
    imagedetection.io/source: "ado-pipeline-token-replace-fallback"
type: Opaque
stringData:
  REDIS_URL: "#{REDIS_CONNECTION_STRING}#"
  DD_API_KEY: "#{DATADOG_API_KEY}#"
  # "user:password" — Flower has no auth of its own; this must be set to
  # something non-empty before imagedetection-flower is exposed anywhere.
  FLOWER_BASIC_AUTH: "#{FLOWER_BASIC_AUTH}#"
